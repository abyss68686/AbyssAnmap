name: Build Abyss Anmap

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          # `yes` exits with SIGPIPE once sdkmanager has accepted all licences.
          # Mask only that expected producer exit; pipefail still catches a
          # real sdkmanager failure.
          (yes || true) | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Fetch and stage supplied Nmap and Vulscan sources
        shell: bash
        run: |
          chmod +x native/prepare-upstream.sh
          native/prepare-upstream.sh

      - name: Build native Nmap for arm64-v8a
        shell: bash
        run: |
          chmod +x native/build-nmap.sh
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.1.12297006" native/build-nmap.sh

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:verifyDebugApkNativeLibraries

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Abyss-Anmap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Publish Abyss Anmap v')
    needs: build-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          release_tag="$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH" | sed -n 's/^Publish Abyss Anmap \(v[0-9][0-9.]*\)$/\1/p')"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          test -n "$release_tag"
          test -n "$version_name"
          test "$release_tag" = "v$version_name"
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Abyss-Anmap-debug-apk
          path: release

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$(find release -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          gh release create "$RELEASE_TAG" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Abyss Anmap $RELEASE_TAG" \
            --notes "Fix: bundled NDK C++ runtime for the arm64 Nmap executable, so the scanner starts correctly on Android. Includes the complete supplied NSE catalogue and the offline Vulscan 2.1 database bundle."
